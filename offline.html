<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c2b4a">
<title>CARL - Offline</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f8f6f0;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{max-width:420px;background:#fff;border:1px solid #d4d0c8;border-top:3px solid #8b6914;border-radius:6px;padding:32px 28px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  img{width:88px;height:88px;border-radius:18px;margin-bottom:16px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;color:#1c2b4a;margin-bottom:10px;letter-spacing:.04em}
  p{color:#555;line-height:1.55;font-size:.98rem;margin-bottom:8px}
  .hint{font-size:.85rem;color:#777068;margin-top:14px}
  a.btn{display:inline-block;margin-top:20px;background:#1c2b4a;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:4px;font-weight:600;letter-spacing:.03em}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="CARL">
    <h1>You're Offline</h1>
    <p>CARL can't reach the network right now. The app itself is installed and works offline.</p>
    <p>Open CARL to compose observations as drafts. They will queue and submit automatically when you are back online.</p>
    <a class="btn" href="/app.html">Open CARL</a>
    <p class="hint">Your queued submissions are saved on this device and will not be lost.</p>
  </div>
</body>
</html>
